admin_area.my_area:
  path: '/my-area'
  defaults:
    _controller: '\Drupal\admin_area\Controller\AdminAreaController::content'
    _title: 'My Area'
  requirements:
    _permission: 'access content'






admin_area.my_entity_page:
  path: '/admin/my-area/{entity_type}'
  defaults:
    _controller: '\Drupal\admin_area\Controller\AdminAreaController::myEntityPage'
    _title: 'My Area'
  requirements:
    _permission: 'access content'
    entity_type: '[a-z_]+'
