euf_csv_import_export.import_ounit_form:
  path: '/admin/import/organizational_unit'
  defaults:
    _form: '\Drupal\euf_csv_import_export\Form\OunitImportForm'
    _title: 'Import Organizational Units from CSV'
  requirements:
    _permission: 'access content' # Build custom access control later
euf_csv_import_export.import_programme_form:
  path: '/admin/import/programme'
  defaults:
    _form: '\Drupal\euf_csv_import_export\Form\ProgrammeImportForm'
    _title: 'Import Programmes from CSV'
  requirements:
    _permission: 'access content' # Build custom access control later
euf_csv_import_export.import_course_form:
  path: '/admin/import/course'
  defaults:
    _form: '\Drupal\euf_csv_import_export\Form\CourseImportForm'
    _title: 'Import IECs from CSV'
  requirements:
    _permission: 'access content' # Build custom access control later