services:
  euf_csv_import_export.csv_importer:
    class: Drupal\euf_csv_import_export\CsvImporter\CsvImporter
    arguments: ['@file_system', '@euf_csv_import_export.file_validator', '@euf_csv_import_export.user_access_manager']
  euf_csv_import_export.file_validator:
    class: Drupal\euf_csv_import_export\FileValidator\FileValidator
    arguments: ['@euf_csv_import_export.user_access_manager', '@euf_csv_import_export.field_mapping_service', '@entity_type.manager']
  euf_csv_import_export.user_access_manager:
    class: Drupal\euf_csv_import_export\AccessManager\UserAccessManager
    arguments: ['@current_user', '@entity_type.manager']
  euf_csv_import_export.field_mapping_service:
    class: Drupal\euf_csv_import_export\CsvConverter\FieldMappingService
